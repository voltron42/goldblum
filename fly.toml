# fly.io configuration
app = "goldblum-hello-world"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  processes = ["app"]
  protocol = "http"

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 200

  [[services.http_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    path = "/api/health"

[[statics]]
  guest_path = "/public"
  url_prefix = "/"

[build.args]
  # Add build arguments if needed

[deploy]
  release_command = "echo 'Deploy complete'"
