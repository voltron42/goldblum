# fly.toml app configuration file generated for goldblum on 2026-05-09T13:03:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'goldblum'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = "echo 'Deploy complete'"

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'http'
  internal_port = 8080
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 200

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/public'
  url_prefix = '/'
